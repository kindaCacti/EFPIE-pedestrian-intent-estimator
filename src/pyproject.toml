[project]
name = "sova-trajectory"
version = "0.1.0"
description = "Temporal pedestrian trajectory extension using the sibling SOVA detector checkout"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=10",
    "PyYAML>=6",
]

[project.optional-dependencies]
detector = [
    "torchvision>=0.18", "tqdm>=4.66", "tensorboard>=2.14",
    "pycocotools>=2.0.7", "faster-coco-eval>=1.6.5",
    "calflops>=0.3", "transformers>=4.40",
]
rtdetrv4 = ["gdown>=5.2"]
deimv2 = ["huggingface_hub>=0.20", "safetensors>=0.4"]
ecdet = ["tabulate>=0.9"]
rfdetr = ["rfdetr>=1.0"]
yolo26 = ["ultralytics>=8.4"]
yolov12 = ["ultralytics>=8.3"]
yolov6 = ["addict>=2.4", "opencv-python>=4.8", "thop>=0.1", "requests>=2.31", "setuptools<81"]
temporal-video = ["opencv-python>=4.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = ["E501"]
lint.per-file-ignores = {"__init__.py" = ["F401"]}
extend-exclude = ["SOVA-signs-det-dev", "third_party"]
